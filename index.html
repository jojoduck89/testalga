
<style>

.opt.ok{background:#EAF3DE;border-color:#639922;color:#3B6D11}
.opt.no{background:#FCEBEB;border-color:#E24B4A;color:#A32D2D}
.opt.rv{background:#EAF3DE;border-color:#639922;color:#3B6D11}

.expl strong{color:var(--color-text-primary);font-weight:500}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{padding:7px 14px;border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);transition:all .15s}

<script>
const TOPICS=[
  {id:'all',label:'ทั้งหมด (50)'},
  {id:'search',label:'Searching'},
  {id:'sort',label:'Sorting'},
  {id:'dp',label:'Greedy/DP'},
  {id:'coin',label:'Coin/Knapsack'},
  {id:'bigo',label:'Big-O / T(n)'},
  {id:'graph',label:'Graph+BFS/DFS'},
];
const Q=[
  {id:1,t:'search',d:'easy',src:'Binary Search Classic',
   q:'Binary Search ต้องการเงื่อนไขอะไรจึงใช้ได้?',
   opts:['A) Array ต้องเป็น unsorted','B) Array ต้องเป็น sorted','C) Array ต้องมีจำนวน element คู่','D) Array ต้องมี no duplicates'],
   a:1,e:'Binary Search ทำงานบน sorted array เท่านั้น โดยแบ่งครึ่ง search space ทุก step ถ้า array ไม่ sorted ผลลัพธ์ผิดพลาดได้'},
  {id:2,t:'search',d:'easy',src:'LeetCode #704',
   q:'Binary Search บน array 1,000,000 elements ใช้กี่ comparisons ใน worst case?',
   opts:['A) 1,000,000','B) 500,000','C) 20','D) 100'],
   a:2,e:'log₂(1,000,000) ≈ 19.93 ≈ 20 ครั้ง เทียบ Linear Search ที่ต้อง 1,000,000 ครั้ง'},
  {id:3,t:'search',d:'medium',src:'LeetCode #33 — Rotated Sorted Array',
   q:'arr=[4,5,6,7,0,1,2], target=0, mid=3, arr[mid]=7 ขั้นตอนถัดไปใน modified binary search?',
   code:'arr=[4,5,6,7,0,1,2], left=0,right=6,mid=3\narr[mid]=7, target=0',
   opts:['A) right=mid-1 เพราะ arr[mid]>target','B) left half [4..7] sorted แต่ 0 ไม่อยู่ใน range → left=mid+1','C) right half [0..2] sorted → right=mid-1','D) B และ C ให้ผลเหมือนกัน'],
   a:1,e:'ตรวจ left half [4,5,6,7] sorted แต่ target=0 ไม่อยู่ใน [4,7] → ค้นหา right half: left=mid+1'},
  {id:4,t:'search',d:'medium',src:'Binary Search — First Occurrence',
   q:'หา first occurrence ของ 2 ใน [1,2,2,2,3,4] ควรแก้ Binary Search อย่างไร?',
   opts:['A) ใช้ Binary Search ปกติ หา index ใดก็ได้','B) เมื่อ arr[mid]==target ให้ right=mid แล้ว track answer','C) ใช้ Linear Search เพราะ Binary Search ไม่รองรับ duplicates','D) ใช้ Two Pointer'],
   a:1,e:'เมื่อพบ target ให้ record index แล้ว continue ค้นหาทาง left: right=mid (ไม่ใช่ mid-1) เพื่อหา leftmost'},
  {id:5,t:'search',d:'hard',src:'LeetCode #4 — Median of Two Sorted Arrays',
   q:'หา median ของ [1,3] และ [2] ใน O(log(m+n)) ควรใช้วิธีใด?',
   opts:['A) Merge แล้วหา median — O(m+n)','B) Binary Search บน partition ของ array เล็ก — O(log(min(m,n)))','C) Linear Search บน array รวม','D) ใช้ Quick Select — O(n) average'],
   a:1,e:'Binary Search partition: แบ่ง array ทั้งสองด้วย partition point ที่ถูกต้อง ตรวจว่า left side ทั้งหมด ≤ right side รันใน O(log(min(m,n)))'},
  {id:6,t:'search',d:'medium',src:'Interpolation Search',
   q:'Interpolation Search เหมาะกับ data แบบใด และ best case complexity คือ?',
   opts:['A) Random data, O(log n)','B) Uniformly distributed data, O(log log n)','C) Sorted data, O(1)','D) Any data, O(n)'],
   a:1,e:'Interpolation Search ใช้ formula pos = lo + ((target-arr[lo])/(arr[hi]-arr[lo]))*(hi-lo) เมื่อ data กระจายสม่ำเสมอ มี avg O(log log n) แต่ worst case O(n)'},
  {id:7,t:'search',d:'hard',src:'LeetCode #74 — Search 2D Matrix',
   q:'Matrix ขนาด m×n ที่แต่ละแถวเรียงลำดับ และแถวแรกของแถวถัดไป > แถวสุดท้ายของแถวก่อน จะ search ใน O(log(m×n)) ได้อย่างไร?',
   opts:['A) Binary Search ทีละแถว O(m log n)','B) Binary Search บน matrix โดย map index: mid → (mid//n, mid%n)','C) DFS จาก top-left','D) Two Pointer จาก top-right'],
   a:1,e:'Treat matrix เป็น 1D array: index i → row=i//n, col=i%n ทำ Binary Search บน virtual 1D array ขนาด m×n รันใน O(log(m×n))'},
  {id:8,t:'search',d:'medium',src:'Ternary Search',
   q:'Ternary Search เหมาะกับการแก้ปัญหาประเภทใดมากที่สุด?',
   opts:['A) Searching ใน sorted array','B) หา maximum/minimum ของ unimodal function','C) String matching','D) Graph traversal'],
   a:1,e:'Ternary Search ใช้หา max/min ของ unimodal function (เพิ่มแล้วลด หรือลดแล้วเพิ่ม) แบ่ง search space เป็น 3 ส่วน complexity O(log₃ n)'},

  {id:9,t:'sort',d:'easy',src:'Sorting Comparison',
   q:'Sorting algorithm ใดมี worst-case O(n log n) เสมอ (ไม่ใช่แค่ average)?',
   opts:['A) Quick Sort','B) Merge Sort และ Heap Sort','C) Insertion Sort','D) Bubble Sort'],
   a:1,e:'Merge Sort: แบ่งครึ่งเสมอ T(n)=2T(n/2)+O(n) → O(n log n) ทุก case Heap Sort: build heap O(n) + n extractions O(log n) each → O(n log n) เสมอ'},
  {id:10,t:'sort',d:'medium',src:'Sorting Stability',
   q:'Stable sorting algorithms คืออะไร และตัวอย่างที่ stable?',
   opts:['A) Sort ที่ทำงาน in-place เช่น Heap Sort','B) Sort ที่รักษาลำดับสัมพัทธ์ของ equal elements เช่น Merge Sort, Insertion Sort','C) Sort ที่มี O(n log n) worst case','D) Sort ที่ไม่ใช้ extra memory'],
   a:1,e:'Stable sort รักษาลำดับ: ถ้า a[i]==a[j] และ i<j ก่อน sort แล้ว a[i] จะอยู่ก่อน a[j] หลัง sort ด้วย Merge Sort, Insertion Sort, Bubble Sort stable; Quick Sort, Heap Sort ไม่ stable'},
  {id:11,t:'sort',d:'medium',src:'LeetCode #912',
   q:'Quick Sort worst case เกิดขึ้นเมื่อใด?',
   opts:['A) Array มี random data','B) Array sorted แล้วและเลือก first/last element เป็น pivot','C) Array มี all equal elements (ใช้ 3-way partition แล้ว)','D) Array มีขนาดคู่'],
   a:1,e:'Worst case O(n²) เมื่อ pivot แย่มาก เช่น sorted array + pick first/last เป็น pivot แต่ละ partition ได้ขนาด (0, n-1) แก้ด้วย random pivot หรือ median-of-three'},
  {id:12,t:'sort',d:'easy',src:'Counting Sort',
   q:'Counting Sort เหมาะกับ input แบบใดและมี complexity อะไร?',
   opts:['A) Real numbers ทุก range, O(n log n)','B) Integers ใน range [0,k] เมื่อ k=O(n), มี O(n+k)','C) Strings, O(n²)','D) Floating point, O(n)'],
   a:1,e:'Counting Sort ทำงานกับ integers ใน range จำกัด: สร้าง count array ขนาด k+1 แล้ว prefix sum มี O(n+k) เมื่อ k เล็ก ทำ better กว่า comparison sorts'},
  {id:13,t:'sort',d:'hard',src:'Radix Sort',
   q:'Radix Sort LSD (Least Significant Digit) มี time complexity อะไรสำหรับ n integers ที่มี d digits?',
   opts:['A) O(n log n)','B) O(d(n+b)) โดย b = base (เช่น 10)','C) O(n²)','D) O(nd)'],
   a:1,e:'Radix Sort ทำ d passes ของ Counting Sort แต่ละ pass O(n+b) รวม O(d(n+b)) เมื่อ d=O(1) และ b=O(n) จะได้ O(n) beats comparison sorts!'},
  {id:14,t:'sort',d:'medium',src:'Tim Sort',
   q:'Tim Sort (ใช้ใน Python, Java) คือ combination ของ algorithm ใด?',
   opts:['A) Merge Sort + Bubble Sort','B) Merge Sort + Insertion Sort','C) Quick Sort + Merge Sort','D) Heap Sort + Insertion Sort'],
   a:1,e:'Tim Sort แบ่ง array เป็น "runs" เล็กๆ ใช้ Insertion Sort (เร็วสำหรับ small arrays) แล้ว Merge runs เข้าด้วยกัน ทำให้ best case O(n) สำหรับ nearly sorted data'},
  {id:15,t:'sort',d:'hard',src:'Lower Bound Proof',
   q:'ทำไม comparison-based sorting มี lower bound Ω(n log n)?',
   opts:['A) เพราะ memory จำกัด','B) Decision tree มี n! leaves → height ≥ log₂(n!) ≈ n log n','C) เพราะต้อง compare ทุกคู่','D) เป็นกฎของ computer science ที่พิสูจน์ไม่ได้'],
   a:1,e:'Decision tree: แต่ละ comparison แบ่ง 2 branches มี n! permutations ที่เป็นไปได้ → tree ต้องมี ≥ n! leaves → height ≥ log₂(n!) ≈ n log n โดย Stirling\'s approximation'},
  {id:16,t:'sort',d:'medium',src:'Dutch National Flag',
   q:'LeetCode #75 Sort Colors: sort [2,0,2,1,1,0] ใน one-pass O(n) O(1) space ใช้ algorithm ใด?',
   code:'Input: [2,0,2,1,1,0]\nOutput: [0,0,1,1,2,2]',
   opts:['A) Counting Sort','B) Dutch National Flag (3-way partition พร้อม 3 pointers)','C) Quick Sort','D) Insertion Sort'],
   a:1,e:'Dutch National Flag: 3 pointers low=0, mid=0, high=n-1 เมื่อ arr[mid]=0 swap(low,mid) low++,mid++ เมื่อ arr[mid]=2 swap(mid,high) high-- เมื่อ arr[mid]=1 mid++ O(n) one-pass'},

  {id:17,t:'dp',d:'easy',src:'Fibonacci DP',
   q:'Fibonacci brute force vs memoization: fib(n) มี complexity อะไรตามลำดับ?',
   opts:['A) O(n) และ O(n)','B) O(2ⁿ) และ O(n)','C) O(n²) และ O(n)','D) O(2ⁿ) และ O(log n)'],
   a:1,e:'Brute: tree มี ~2ⁿ nodes แต่ละ node O(1) → O(2ⁿ) Memo: แต่ละ subproblem คำนวณครั้งเดียว n subproblems → O(n)'},
  {id:18,t:'dp',d:'medium',src:'Activity Selection — Greedy',
   q:'Activity Selection Problem: Greedy ที่ optimal คือ?',
   opts:['A) เลือก activity ที่ start_time น้อยสุด','B) เลือก activity ที่ duration สั้นสุด','C) เลือก activity ที่ end_time น้อยสุด (Earliest Finish)','D) เลือก activity ที่ start_time มากสุด'],
   a:2,e:'EFT Greedy: เลือก activity ที่จบก่อน ทำให้เหลือเวลามากสุดสำหรับ activities ถัดไป พิสูจน์โดย exchange argument ว่า EFT ≥ optimal solution อื่นทุกตัว'},
  {id:19,t:'dp',d:'hard',src:'LeetCode #1143 — LCS',
   q:'LCS("ABCBDAB","BDCAB") มีความยาวเท่าไหร่?',
   opts:['A) 3','B) 4','C) 5','D) 6'],
   a:1,e:'LCS = "BCAB" หรือ "BDAB" ยาว 4 DP: dp[i][j] = LCS ของ X[0..i-1] กับ Y[0..j-1] ถ้า X[i]==Y[j] → dp[i][j]=dp[i-1][j-1]+1'},
  {id:20,t:'dp',d:'medium',src:'DP vs Greedy',
   q:'ปัญหาใดต่อไปนี้ Greedy ให้ผล optimal แน่นอน?',
   opts:['A) 0/1 Knapsack','B) Fractional Knapsack','C) Matrix Chain Multiplication','D) Edit Distance'],
   a:1,e:'Fractional Knapsack: เลือก item ที่ value/weight สูงสุดก่อน เอาบางส่วนได้ → Greedy optimal 0/1 Knapsack ต้องเลือกทั้งชิ้น → ต้องใช้ DP'},
  {id:21,t:'dp',d:'hard',src:'LeetCode #72 — Edit Distance',
   q:'Edit Distance (Levenshtein) ของ "horse" และ "ros" คือ? (insert/delete/replace แต่ละอย่างมี cost 1)',
   opts:['A) 2','B) 3','C) 4','D) 5'],
   a:1,e:'horse → rorse (replace h→r) → rose (remove r) → ros (remove e) = 3 operations DP: dp[i][j] = min edit distance ของ word1[0..i] และ word2[0..j]'},
  {id:22,t:'dp',d:'medium',src:'LeetCode #300 — LIS',
   q:'Longest Increasing Subsequence (LIS) ของ [10,9,2,5,3,7,101,18] มีความยาวเท่าไหร่?',
   code:'arr = [10, 9, 2, 5, 3, 7, 101, 18]',
   opts:['A) 3','B) 4','C) 5','D) 6'],
   a:1,e:'LIS = [2,3,7,101] หรือ [2,5,7,101] ยาว 4 DP naive O(n²): dp[i]=max LIS ending at i DP+binary search O(n log n): maintain patience sorted array'},
  {id:23,t:'dp',d:'hard',src:'LeetCode #312 — Burst Balloons',
   q:'Burst Balloons: เหตุใดต้องใช้ Interval DP แทน Linear DP?',
   opts:['A) เพราะ array มีขนาดใหญ่','B) เพราะการ burst balloon ทำให้ neighbors เปลี่ยน — ต้อง define subproblem เป็น interval ที่ยัง intact','C) เพราะ Greedy ไม่ work','D) เพราะต้องการ O(1) space'],
   a:1,e:'Key insight: แทนที่จะคิดว่า "burst อันไหนก่อน" ให้คิดว่า "อันไหนถูก burst เป็น last ใน interval (i,j)" → dp[i][j] = max coins จาก last burst ใน (i,j)'},
  {id:24,t:'dp',d:'medium',src:'Matrix Chain Multiplication',
   q:'Matrix Chain: A(10×30) × B(30×5) × C(5×60) optimal parenthesization คือ?',
   opts:['A) (A×B)×C: cost=10×30×5+10×5×60=1500+3000=4500','B) A×(B×C): cost=30×5×60+10×30×60=9000+18000=27000','C) ทั้งสองให้ cost เท่ากัน','D) ต้องใช้ Greedy'],
   a:0,e:'(A×B)×C ดีกว่า: (A×B)=10×30×5=1500 operations แล้ว result(10×5)×C=10×5×60=3000 รวม 4500 A×(B×C): (B×C)=30×5×60=9000 แล้ว A×result=10×30×60=18000 รวม 27000'},

  {id:25,t:'coin',d:'easy',src:'Coin Change — Greedy fails',
   q:'coins=[1,5,6,9], amount=11 Greedy (เลือกใหญ่สุดก่อน) vs DP ให้ผลต่างกันอย่างไร?',
   opts:['A) Greedy ดีกว่า: 9+1+1=3 coins','B) DP ดีกว่า: 5+6=2 coins','C) ทั้งสองให้ 2 coins เหมือนกัน','D) ต้องการ 4 coins'],
   a:1,e:'Greedy: 9+1+1=3 coins DP พบ 5+6=11 ใช้แค่ 2 coins ตัวอย่างนี้แสดงว่า Greedy ไม่ optimal สำหรับ Coin Change ทั่วไป'},
  {id:26,t:'coin',d:'medium',src:'LeetCode #322 — Coin Change DP',
   q:'DP Coin Change: dp[i]=min coins ที่ทำได้ amount i โค้ดด้านล่างมีบั๊กตรงไหน?',

let curTopic='all';
const ans={};
const userAns={};

function getQ(){return curTopic==='all'?Q:Q.filter(q=>q.t===curTopic);}
function topicOf(t){const m={search:'Searching',sort:'Sorting',dp:'Greedy/DP',graph:'Graph',bigo:'Big-O',coin:'Coin/Knapsack'};return m[t]||t;}
function badgeOf(t){const m={search:'bs',sort:'bso',dp:'bdp',graph:'bgr',bigo:'bbo',coin:'bco'};return m[t]||'bs';}
function diffOf(d){return{easy:'de',medium:'dm',hard:'dh'}[d]||'de';}

function renderTabs(){
  document.getElementById('tabs').innerHTML=TOPICS.map(t=>`<button class="tab${curTopic===t.id?' active':''}" onclick="setT('${t.id}')">${t.label}</button>`).join('');
}
function setT(id){curTopic=id;renderTabs();renderAll();}

function updateStats(){
  const qs=getQ();
  const done=qs.filter(q=>ans[q.id]!==undefined).length;
  const ok=qs.filter(q=>ans[q.id]===true).length;
  const no=qs.filter(q=>ans[q.id]===false).length;
  document.getElementById('sT').textContent=qs.length;
  document.getElementById('sC').textContent=ok;
  document.getElementById('sW').textContent=no;
  document.getElementById('sP').textContent=done?Math.round(ok/done*100)+'%':'—';
  document.getElementById('pf').style.width=qs.length?Math.round(done/qs.length*100)+'%':'0%';
}

function renderAll(){
  updateStats();
  const qs=getQ();
  document.getElementById('qa').innerHTML=qs.map((q,i)=>renderQ(q,i)).join('');
}

function renderQ(q,i){
  const done=ans[q.id]!==undefined;
  const ua=userAns[q.id];
  const opts=q.opts.map((o,j)=>{
    let cls='opt';
    if(done){
      cls+=' dis';
      if(j===q.a)cls+=' ok';
      else if(j===ua&&ua!==q.a)cls+=' no';
    }
    const oc=done?'':`onclick="pick(${q.id},${j})"`;
    return`<button class="${cls}" ${oc}>${o}</button>`;
  }).join('');
  const expl=done?`<div class="expl"><strong>คำอธิบาย:</strong> ${q.e}</div>`:'';
  const act=!done?`<div class="acts"><button class="btn btn-p" onclick="askAI(${q.id})">ถาม AI อธิบาย ↗</button></div>`:'';
  return`<div class="qcard" id="qc-${q.id}">
    <div class="qmeta">
      <span class="badge ${badgeOf(q.t)}">${topicOf(q.t)}</span>
      <span class="qnum">#${i+1} · ${q.src}</span>
      <span class="qdiff ${diffOf(q.d)}">${q.d}</span>
    </div>
    <div class="qtext">${q.q}</div>
    ${q.code?`<div class="qcode">${q.code}</div>`:''}
    <div class="opts">${opts}</div>
    ${expl}${act}
  </div>`;
}

function pick(qid,optIdx){
  if(ans[qid]!==undefined)return;
  const q=Q.find(x=>x.id===qid);
  userAns[qid]=optIdx;
  ans[qid]=optIdx===q.a;
  renderAll();
  const el=document.getElementById('qc-'+qid);
  if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function askAI(qid){
  const q=Q.find(x=>x.id===qid);
  if(!q)return;
  sendPrompt(`อธิบายข้อ "${q.src}" ให้ละเอียดขึ้น พร้อมตัวอย่างโค้ดหรือ trace ถ้าทำได้`);
}

renderTabs();
renderAll();
</script>
